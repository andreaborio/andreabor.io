<header class="site-header">
  <div class="site-bar">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="Andrea Borio, home">
      <span class="brand-puck" aria-hidden="true">{{ partial "dotto.html" (dict "mode" "idle" "size" 18) }}</span>
      <span class="brand-name fx">Andrea Borio</span>
    </a>
    <nav aria-label="Main navigation">
      <a href="{{ "/posts/" | relURL }}"{{ if eq .Section "posts" }} aria-current="page"{{ end }}>Posts</a>
      <a href="{{ "/agents/" | relURL }}"{{ if eq .Section "agents" }} aria-current="page"{{ end }}>Agents</a>
      <a href="{{ "/about/" | relURL }}"{{ if eq .RelPermalink "/about/" }} aria-current="page"{{ end }}>About</a>
      <a href="{{ "/now/" | relURL }}"{{ if eq .RelPermalink "/now/" }} aria-current="page"{{ end }}>Now</a>
    </nav>
  </div>
  <div class="rail" aria-hidden="true"><span class="walker">{{ partial "dotto.html" (dict "mode" "walk" "size" 18) }}</span></div>
</header>
